<mat-card>
  <mat-card-title>🧠 Mes Machines Virtuelles</mat-card-title>
  <mat-card-content>
<button mat-raised-button color="primary" [routerLink]="['/vms/create']">
  ➕ Créer une VM
</button>

    <table mat-table [dataSource]="vms" class="mat-elevation-z8 w-100 mt-3">

      <!-- Nom -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let vm">{{ vm.name }}</td>
      </ng-container>

      <!-- OS -->
      <ng-container matColumnDef="os">
        <th mat-header-cell *matHeaderCellDef>OS</th>
        <td mat-cell *matCellDef="let vm">{{ vm.osType }}</td>
      </ng-container>

      <!-- Taille -->
      <ng-container matColumnDef="size">
        <th mat-header-cell *matHeaderCellDef>Taille</th>
        <td mat-cell *matCellDef="let vm">{{ vm.size }}</td>
      </ng-container>

      <!-- Date -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let vm">{{ vm.createdAt | date:'short' }}</td>
      </ng-container>

      <!-- Action -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let vm">
          <button mat-icon-button color="accent" (click)="goToDetails(vm.name)">
            <mat-icon>terminal</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['name', 'os', 'size', 'createdAt', 'action']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['name', 'os', 'size', 'createdAt', 'action'];"></tr>

    </table>
  </mat-card-content>
</mat-card>
